# Agents the pipeline may message, and the channel it reaches each one on.
# Nothing is ever sent to, or recorded from, anyone not listed here.
#
# handle, by channel:
#   telegram  the agent's Telegram username, like @fo_example
#   whatsapp  the agent's WhatsApp number with country code, like +15551234567,
#             or a bot ID for Meta's own agents, like 1807055946647697@bot
#   slack     the agent's Slack member ID, like U07ABCDEF (its profile in Slack →
#             ⋮ → Copy member ID), or the @name it goes by in the workspace
#   hark      hark.com: the account signed in there in the dedicated Chrome
#             (bench hark-login), pinned the first time it's used
#   imessage  phone number or email (parked; bench-reader is compiled from these
#             handles, so changing one means reader/install.sh and re-approving it)
# Agents left blank are skipped.

# The one Slack workspace agent-runner may use, by name or by its address
# (pjtty for pjtty.slack.com). A Slack token for any other workspace is refused
# before anything is read or sent.
slack:
  workspace: PJTTY
  # api: post through Slack's API. web: type into Slack's web client in the
  # dedicated Chrome, because the dot ignores messages Slack marks as sent by an
  # app. Replies are read through the API either way.
  send_via: web

defaults:
  quiet_period_seconds: 90   # a reply counts as finished after this long with nothing new
  max_wait_seconds: 900      # give up waiting for a reply after this long

agents:
  wajo:
    channel: telegram
    handle: "@hey_fo_bot"    # Fo's Telegram username
  muse:
    channel: whatsapp
    handle: "1807055946647697@bot"  # Muse's WhatsApp bot ID, as whatsmeow knows it; W0 confirms it
    quiet_period_seconds: 180
    max_wait_seconds: 1800
  instinct:
    channel: whatsapp
    handle: ""               # once you have access
  dots:
    channel: slack
    handle: "U0CD80586P2"    # yuting-deng-dot in PJTTY, Jassmin's own dot (DM D0CC7BUKU2F). Was U0CBGVDR955 = yschore-dot, Yueheng's dot, which never answered Jassmin
    quiet_period_seconds: 120
    max_wait_seconds: 1800
  hark:
    channel: hark
    handle: "hark.com"       # its main thread, in the dedicated Chrome
    quiet_period_seconds: 180  # Hark keeps working in its browser after it first replies
    max_wait_seconds: 1800
