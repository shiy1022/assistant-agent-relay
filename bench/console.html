    $('send').disabled = sending || !names.length || !text.trim() || (mode === 'run' && !task);
    $('text').placeholder = names.length === 1 ? `Message ${label(names[0])}` : names.length ? `Message ${names.map(label).join(', ')} (the same words to each)` : 'Pick who to send to';

    const lines = [];
    for (const n of names) {
      const ch = channelOf(n);
      const ahead = laneJob(ch);
      const queued = jobs.filter(j => j.channel === ch && j.state === 'queued').length;
      if (ahead && ahead.kind === 'run') {
        lines.push(`${esc(label(n))}: waits for ${esc(label(ahead.agent))}'s task run to finish. You can stop it in ${esc(label(ahead.agent))}'s column.`);
      } else if (queued) {
        lines.push(`${esc(label(n))}: waits behind ${plural(queued, 'job')} queued on ${esc(CHANNELS[ch])}.`);
      }
    }
    const channels = new Set(names.map(channelOf));
    if (names.length > 1 && channels.size < names.length) lines.push('Agents on the same channel get it one after the other.');
    if (mode === 'run') {
      const quiet = names.map(n => `${label(n)} ${duration(agentInfo(n).quiet_period_seconds)}`).join(', ');
      lines.push(`Records until ${names.length > 1 ? 'each agent' : 'it'} has been quiet for ${quiet ? 'its quiet period (' + esc(quiet) + ')' : 'its quiet period'}, then writes <code>runs/…/</code>. Task, step and cell go in its run.json.`);
    }
    const focused = document.activeElement === $('text') || text.trim();
    const intro = sendError ? `<span class="err">${esc(sendError)}</span>` : dryRun ? 'Dry run: nothing is sent.'
      : focused ? `Sent exactly as written, as <code>bench ${mode === 'run' ? 'run' : 'send'}</code> would. <kbd>⌘</kbd> <kbd>↩</kbd> sends.` : '';
    $('text').classList.toggle('filled', !!text.trim());
    setHTML($('hint'), intro + (lines.length ? `<ul>${lines.map(l => `<li>${l}</li>`).join('')}</ul>` : ''));
  }

  async function api(path, body) {
    const r = await fetch(path, {
      method: body ? 'POST' : 'GET',
      headers: { 'X-Console-Token': TOKEN, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
      cache: 'no-store',
    });
    let out = {};
    try { out = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error(out.error || `the console answered ${r.status}`);
    return out;
  }

  async function send() {
    const names = chosen();
    const text = $('text').value;
    if (sending || blind || !names.length || !text.trim()) return;
    sending = true;
    sendError = '';
    renderComposer();
    try {
      await api('/api/send', mode === 'run'
        ? { agents: names, text, mode, task: $('task').value, step: $('step').value, cell: $('cell').value }
        : { agents: names, text, mode, listen: Number($('listen').value) });
      $('text').value = '';
      store.set('draft', '');
    } catch (e) {
      sendError = `Not sent: ${e.message}`;
    } finally {
      sending = false;
      await poll();
      renderComposer();
    }
  }

  // MARK: Updates

  function renderAll(force = false) {
    if (!data) return;
    if (step && !(session() && session().steps.some(s => s.step === step))) step = null;
    renderSessions();
    renderSteps();
    renderGrading();
    renderComposer();
    renderColumns(force);
    renderMail();
  }

  function renderLive() {
    const el = $('live');
    el.className = 'live ' + (connected ? 'on' : connected === false ? 'off' : '');
    $('live-text').textContent = connected ? 'Live' + (data && data.sources.length ? ` · recorded ${when(data.sources.map(s => s.last).filter(Boolean).sort().pop())}` : '')
      : connected === false ? `Can't reach the console${lastOk ? ` since ${time(lastOk)}` : ''}. Is bench console still running?` : 'Connecting…';
    const banner = [];
    if (dryRun) banner.push('Dry run: messages typed here are shown but not sent to anyone. Start <code>uv run bench console</code> without <code>--dry-run</code> to send.');
    if (watchError) banner.push(esc(watchError));
    setHTML($('banner'), banner.join('<br>'));
    $('banner').hidden = !banner.length;
  }

  async function loadTask(quiet = false) {
    const s = session();
    if (!s) { taskInfo = null; taskInfoKey = ''; return; }
    try {
      taskInfo = await api(`/api/task?task=${encodeURIComponent(s.task)}&date=${encodeURIComponent(s.date)}`);
      taskInfoKey = s.key + '@' + Date.now();
      taskError = '';
    } catch (e) {
      taskError = `Couldn't load the task: ${e.message}`;
    }
    if (!quiet) renderAll();
  }

  async function loadMail(fresh = false) {
    const s = session();
    if (!s || mailLoading) return;
    const key = s.key;
    mailLoading = true;
    renderMail();
    try {
      const out = await api(`/api/mail?task=${encodeURIComponent(s.task)}&date=${encodeURIComponent(s.date)}${fresh ? '&fresh=1' : ''}`);
      if ((session() || {}).key === key) { mail = out; mailKey = key; mailError = ''; }
    } catch (e) {
      if ((session() || {}).key === key) mailError = e.message;
    }
    mailLoading = false;
    renderMail();
  }

  function sessionChanged() {
    const s = session();
    step = s ? (store.get('step:' + s.key, '') || null) : null;
    taskInfo = null; taskError = '';
    mail = null; mailError = ''; mailKey = '';
    columnState.clear();
    if (s) {
      if (!$('task').value) { $('task').value = s.task; store.set('task', s.task); }
      loadTask();
      loadMail();
    }
    renderAll(true);
  }

  async function poll() {
    try {
      const st = await api('/api/state' + (version != null ? `?since=${version}` : ''));
      const first = !data;
      if (st.snapshot) data = st.snapshot;
      version = st.version;
      jobs = st.jobs;
      sendable = st.agents;
      dryRun = st.dry_run;
      watchError = st.error;
      const before = (session() || {}).key;
      sessions = st.tasks || [];
      clockOffset = d(st.now) - Date.now();
      connected = true;
      lastOk = new Date().toISOString();
      if (first) {
        renderFooter();
        sessionChanged();
      } else {
        if ((session() || {}).key !== before) sessionChanged();
        else renderAll();
      }
    } catch (e) {
      connected = false;
    }
    renderLive();
  }

  function renderFooter() {
    const sources = data.sources.map(s => `<li>${esc(CHANNELS[s.channel] || s.channel)}: <code>${esc(s.path)}</code></li>`).join('');
    $('footer').innerHTML = `This page updates by itself while <code>uv run bench console</code> is running. A task day is every run of one task
      (run.json's <code>task</code>) that started on one date; each column holds only that agent's conversation from its first run of it on.
      Each message is sent by running <code>bench send</code> (or <code>bench run</code> for a task run), and its prompt and output are kept in
      <code>data/console/</code>. Rankings are saved in <code>data/grades/</code>. Telegram, Slack and Hark messages that arrive while nothing
      is recording show up after a Sync. Recorded from: ${sources ? `<ul>${sources}</ul>` : ''}`;
  }

  // MARK: Events

  $('session').addEventListener('change', e => {
    sessionKey = e.target.value;
    store.set('session', sessionKey);
    sessionChanged();
  });
  $('steps').addEventListener('click', e => {
    const b = e.target.closest('[data-step]');
    if (!b) return;
    step = b.dataset.step || null;
    const s = session();
    if (s) store.set('step:' + s.key, step || '');
    gradeStatus = '';
    columnState.clear();
    renderAll(true);
    // Bring each column's first message to compare (or its "nothing to grade" note) into view
    if (step) for (const col of document.querySelectorAll('section.col[data-agent]')) {
      const target = col.querySelector('mark.subj, .msg.graded, .graded-none');
      const thread = col.querySelector('.col-thread');
      if (target && thread) thread.scrollTop += target.getBoundingClientRect().top - thread.getBoundingClientRect().top - 40;
    }
  });
  $('blind').checked = blind;
  $('blind').addEventListener('change', e => {
    blind = e.target.checked;
    store.set('blind', blind ? '1' : '0');
    if (blind) closeResetForm();
    renderAll(true);
  });
  $('grading').addEventListener('click', e => {
    const r = e.target.closest('[data-rank]');
    if (r) {
      return setRank(step, r.dataset.agent, Number(r.dataset.rank), r.dataset.aspect || '');
    }
    if (e.target.closest('[data-clear-ranks]')) return saveGrade(step, next => { next.ranks = {}; next.aspect_ranks = {}; });
  });
  $('grading').addEventListener('toggle', e => {
    const h = e.target.dataset && e.target.dataset.open;
    if (!h) return;
    if (e.target.open) { openItems.add('g:' + h); openItems.delete('g:' + h + ':closed'); }
    else { openItems.delete('g:' + h); openItems.add('g:' + h + ':closed'); }
  }, true);
  $('columns').addEventListener('click', async e => {
    const sr = e.target.closest('[data-subj-rank]');
    if (sr) { e.preventDefault(); return setRank(sr.dataset.step, sr.dataset.agent, Number(sr.dataset.subjRank), sr.dataset.aspect || ''); }
    const gj = e.target.closest('[data-jump-subj]');
    if (gj) {
      const name = gj.closest('.col').dataset.agent, st = gj.dataset.step, key = gj.dataset.jumpSubj;
      if (step && step !== st) {
        step = st;
        const s = session();
        if (s) store.set('step:' + s.key, step);
        columnState.clear();
        renderAll(true);
      }
      const col = document.querySelector(`section.col[data-agent="${CSS.escape(name)}"]`);
      const mark = col && col.querySelector(`mark.subj[data-subj-key="${CSS.escape(key)}"]`);
      const thread = col && col.querySelector('.col-thread');
      if (mark && thread) {
        thread.scrollTop += mark.getBoundingClientRect().top - thread.getBoundingClientRect().top - 40;
        mark.classList.remove('flash'); void mark.offsetWidth; mark.classList.add('flash');
      }
      return;
    }
    const jump = e.target.closest('[data-jump]');
    if (jump) {
      const col = jump.closest('.col');
      const name = col.dataset.agent;
      const st = jump.dataset.jump;
      if (step && step !== st) {  // the columns show another step: show the whole day, then go there
        step = null;
        const s = session();
        if (s) store.set('step:' + s.key, '');
        columnState.clear();
        columnState.set(name, { jump: st });
        return renderAll(true);
      }
      const target = col.querySelector(`.run[data-step="${CSS.escape(st)}"]`);
      const thread = col.querySelector('.col-thread');
      if (target) thread.scrollTop = target.offsetTop - 4;
      return;
    }
    const g = e.target.closest('[data-grade-this]');
    if (g) return saveGrade(step, next => {
      const cur = next.marked[g.dataset.agent];
      next.marked[g.dataset.agent] = Array.isArray(cur) ? [...new Set([...cur, g.dataset.gradeThis])] : [g.dataset.gradeThis];
    });
    const ug = e.target.closest('[data-ungrade]');
    if (ug) return saveGrade(step, next => {
      const cur = next.marked[ug.dataset.agent];
      const base = Array.isArray(cur) ? cur : (ug.dataset.pick || '').split(' ').filter(Boolean);
      next.marked[ug.dataset.agent] = base.filter(x => x !== ug.dataset.ungrade);
    });
    const stop = e.target.closest('[data-stop]');
    if (stop) {
      stop.disabled = true;
      try { await api('/api/stop', { job: stop.dataset.stop }); } catch (err) { /* it finished meanwhile; the next poll shows it */ }
      return poll();
    }
    const sync = e.target.closest('[data-sync]');
    if (sync) {
      sync.disabled = true;
      try { await api('/api/sync', { agent: sync.dataset.sync }); } catch (err) { sendError = `Couldn't sync: ${err.message}`; }
      return poll();
    }
    const reset = e.target.closest('[data-reset]');
    if (reset) openResetForm(entryFor(reset.dataset.reset));
  });
  $('columns').addEventListener('toggle', e => {
    if (e.target.dataset && e.target.dataset.job) openLogs.set(e.target.dataset.job, e.target.open);
    if (e.target.dataset && e.target.dataset.older) openLogs.set('older:' + e.target.dataset.older, e.target.open);
  }, true);
  $('mailcal').addEventListener('click', e => {
    const f = e.target.closest('[data-mail-filter]');
    if (f) { mailFilter = f.dataset.mailFilter; store.set('mailFilter', mailFilter); renderMail(); return; }
    if (e.target.id === 'mail-refresh') loadMail(true);
  });
  $('mailcal').addEventListener('toggle', e => {
    const id = e.target.dataset && e.target.dataset.item;
    if (id) e.target.open ? openItems.add(id) : openItems.delete(id);
  }, true);

  // MARK: Recording a reset

  let resetFor = null;  // the agent the open form is for

  function openResetForm(entry) {
    resetFor = entry.name;
    $('rf-agent').textContent = label(entry.name);
    const recent = entry.items.filter(i => i.type === 'message').sort((a, b) => d(b.date) - d(a.date)).slice(0, 15);
    $('rf-after').innerHTML = recent.map(m => {
      const what = m.service ? (NOTICES[m.service] || m.service) : (m.text || 'no text').replace(/\s+/g, ' ').slice(0, 60);
      return `<option value="${esc(m.guid)}">Right after ${esc(when(m.date))} · ${esc(m.from_me ? 'You' : label(entry.name))}: ${esc(what)}</option>`;
    }).join('') + '<option value="">Now</option>';
    $('rf-err').textContent = '';
    $('reset-form').hidden = false;
    $('rf-how').focus();
  }

  function closeResetForm() {
    resetFor = null;
    $('reset-form').hidden = true;
  }

  $('rf-cancel').addEventListener('click', closeResetForm);
  $('reset-form').addEventListener('submit', async e => {
    e.preventDefault();
    if (!$('rf-how').value.trim()) { $('rf-err').textContent = 'Say what was done.'; return; }
    try {
      await api('/api/reset', { agent: resetFor, how: $('rf-how').value, method: $('rf-method').value,
        after: $('rf-after').value || null, result: $('rf-result').value });
      $('rf-how').value = $('rf-result').value = '';
      closeResetForm();
      await poll();
    } catch (err) {
      $('rf-err').textContent = `Not recorded: ${err.message}`;
    }
  });

  $('recipients').addEventListener('click', e => {
    const b = e.target.closest('[data-to]');
    if (!b) return;
    const names = chosen();
    if (b.dataset.to === '*') {
      recipients = null;
    } else {
      const n = b.dataset.to;
      recipients = names.includes(n) ? names.filter(x => x !== n) : sendable.map(a => a.name).filter(x => x === n || names.includes(x));
    }
    sendError = '';
    renderComposer();
  });
  document.querySelector('.seg2').addEventListener('click', e => {
    const b = e.target.closest('[data-mode]');
    if (!b) return;
    mode = b.dataset.mode;
    store.set('mode', mode);
    renderComposer();
  });
  $('composer').addEventListener('submit', e => { e.preventDefault(); send(); });
  $('text').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
  });
  $('text').addEventListener('input', () => { sendError = ''; store.set('draft', $('text').value); renderComposer(); });
  $('text').addEventListener('focus', () => renderComposer());
  $('text').addEventListener('blur', () => renderComposer());
  for (const id of ['task', 'step', 'cell']) {
    $(id).value = store.get(id, '');
    $(id).addEventListener('input', () => { store.set(id, $(id).value); renderComposer(); });
  }
  $('listen').value = store.get('listen', '300');
  if (!$('listen').value) $('listen').value = '300';
  $('listen').addEventListener('change', () => store.set('listen', $('listen').value));
  $('text').value = store.get('draft', '');
  $('q').addEventListener('input', e => { query = e.target.value; renderColumns(); });
  $('details').checked = details;
  $('details').addEventListener('change', e => {
    details = e.target.checked;
    store.set('details', details ? '1' : '0');
    renderColumns();
  });

  poll();
  setInterval(poll, POLL_MS);
  setInterval(() => loadTask(), TASK_MS);
  setInterval(() => loadMail(), MAIL_MS);
})();
</script>
</body>
</html>
